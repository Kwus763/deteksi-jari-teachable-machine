<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deteksi Jari - Teachable Machine</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1f2937;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 24px;
        }

        #start-btn {
            background: #2a5298;
            color: #ffffff;
            border: none;
            padding: 12px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #start-btn:hover {
            background: #1e3c72;
        }

        #start-btn:active {
            transform: scale(0.97);
        }

        #start-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            margin-top: 12px;
            font-size: 0.85rem;
            color: #6b7280;
            min-height: 1.2em;
        }

        #webcam-container {
            margin: 20px auto 0;
            display: flex;
            justify-content: center;
        }

        #webcam-container canvas {
            border-radius: 12px;
            border: 3px solid #e5e7eb;
        }

        #label-container {
            margin-top: 20px;
            text-align: left;
        }

        .result-row {
            margin-bottom: 14px;
        }

        .result-row .row-top {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .bar-bg {
            background: #e5e7eb;
            border-radius: 999px;
            height: 12px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #9ca3af;
            border-radius: 999px;
            transition: width 0.15s ease, background 0.15s ease;
        }

        .result-row.top .bar-fill {
            background: #16a34a;
        }

        .result-row.top .row-top {
            color: #16a34a;
            font-weight: 700;
        }

        #final-result {
            margin-top: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e3c72;
            min-height: 1.4em;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Deteksi Jumlah Jari</h1>
        <p class="subtitle">Model Klasifikasi Gambar dengan Teachable Machine</p>

        <button type="button" id="start-btn" onclick="init()">Start</button>
        <div id="status"></div>

        <div id="webcam-container"></div>
        <div id="final-result"></div>
        <div id="label-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        // More API functions here:
        // https://github.com/googlecreativelab/teachablemachine-community/tree/master/libraries/image

        // the link to your model provided by Teachable Machine export panel
        const URL = "./my_model/";

        let model, webcam, labelContainer, maxPredictions;

        // Load the image model and setup the webcam
        async function init() {
            const startBtn = document.getElementById("start-btn");
            const status = document.getElementById("status");

            startBtn.disabled = true;
            status.innerText = "Memuat model, mohon tunggu...";

            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                // load the model and metadata
                // Refer to tmImage.loadFromFiles() in the API to support files from a file picker
                // or files from your local hard drive
                // Note: the pose library adds "tmImage" object to your window (window.tmImage)
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // Convenience function to setup a webcam
                const flip = true; // whether to flip the webcam
                webcam = new tmImage.Webcam(300, 300, flip); // width, height, flip
                await webcam.setup(); // request access to the webcam
                await webcam.play();
                window.requestAnimationFrame(loop);

                // append elements to the DOM
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                labelContainer = document.getElementById("label-container");
                for (let i = 0; i < maxPredictions; i++) { // and class labels
                    const row = document.createElement("div");
                    row.className = "result-row";
                    row.innerHTML =
                        '<div class="row-top"><span class="name"></span><span class="percent"></span></div>' +
                        '<div class="bar-bg"><div class="bar-fill"></div></div>';
                    labelContainer.appendChild(row);
                }

                startBtn.style.display = "none";
                status.innerText = "Arahkan jari Anda ke kamera.";
            } catch (error) {
                console.error(error);
                startBtn.disabled = false;
                status.innerText = "Gagal memuat. Pastikan kamera diizinkan dan folder my_model sudah lengkap.";
            }
        }

        async function loop() {
            webcam.update(); // update the webcam frame
            await predict();
            window.requestAnimationFrame(loop);
        }

        // run the webcam image through the image model
        async function predict() {
            // predict can take in an image, video or canvas html element
            const prediction = await model.predict(webcam.canvas);

            let topIndex = 0;
            for (let i = 1; i < maxPredictions; i++) {
                if (prediction[i].probability > prediction[topIndex].probability) {
                    topIndex = i;
                }
            }

            for (let i = 0; i < maxPredictions; i++) {
                const row = labelContainer.childNodes[i];
                const percent = (prediction[i].probability * 100).toFixed(0);

                row.querySelector(".name").innerText = prediction[i].className;
                row.querySelector(".percent").innerText = percent + "%";
                row.querySelector(".bar-fill").style.width = percent + "%";
                row.classList.toggle("top", i === topIndex);
            }

            document.getElementById("final-result").innerText =
                "Terdeteksi: " + prediction[topIndex].className;
        }
    </script>
</body>
</html>
